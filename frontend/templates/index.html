<!-- index.html – Posts-Seite des catchKen Content Hub -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catchKen Content Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-top">
            <img src="/static/img/logo.png" alt="catchKen" class="header-logo">
            <div class="header-text">
                <h1>catchKen Content Hub</h1>
                <p>Social Media Planner</p>
            </div>
        </div>
        <nav class="header-nav">
            <a href="/" class="btn-nav-link active">Posts</a>
            <a href="/theory" class="btn-nav-link">Theorie</a>
            <a href="/news" class="btn-nav-link">News</a>
            <a href="/calendar" class="btn-nav-link">Kalender</a>
            <a href="/training" class="btn-nav-link">Training</a>
        </nav>
    </header>

    <main>
        <!-- Trainingsdaten-Status -->
        <section class="card training-status" id="training-status"></section>

        <!-- Formular: Neuer Post -->
        <section class="card">
            <h2>Post: Prüfung bestanden</h2>
            <form id="success-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="student_name">Vorname (optional)</label>
                    <input type="text" id="student_name" name="student_name" placeholder="z.B. Max" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="exam_date">Prüfungsdatum *</label>
                    <input type="date" id="exam_date" name="exam_date" required>
                </div>
                <div class="form-group">
                    <label for="category">Kategorie</label>
                    <select id="category" name="category">
                        <option value="B" selected>B – Auto</option>
                        <option value="A">A – Motorrad</option>
                        <option value="A1">A1 – Kleinmotorrad</option>
                        <option value="BE">BE – Auto mit Anhänger</option>
                        <option value="C">C – Lastwagen</option>
                        <option value="D">D – Bus</option>
                    </select>
                </div>
                <!-- Details-Feld: Zusatzinfos die der LLM beim Generieren bekommt -->
                <div class="form-group">
                    <label for="details">Details für KI (optional)</label>
                    <textarea id="details" name="details" rows="2"
                        placeholder="z.B. Beim ersten Versuch bestanden, war sehr aufgeregt..."></textarea>
                </div>
                <!-- Mehrere Bilder möglich -->
                <div class="form-group">
                    <label for="images">Bilder (optional, mehrere möglich)</label>
                    <input type="file" id="images" name="images" accept="image/*" multiple>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="consent_given" name="consent_given" required>
                    <label for="consent_given">Einverständnis für Bildnutzung auf Social Media *</label>
                </div>
                <button type="submit" class="btn-primary">Post erstellen</button>
            </form>
            <div id="form-message" class="message hidden"></div>
        </section>

        <!-- Liste der Posts -->
        <section class="card">
            <h2>Alle Posts</h2>
            <div id="posts-list"><p class="loading">Lade Posts...</p></div>
        </section>
    </main>

    <!-- Modal: Generierter Content (LLM) -->
    <div id="generate-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Generierter Content</h3>
                <button class="modal-close" onclick="closeModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div id="modal-provider-info" class="provider-info"></div>
                <div class="generated-section">
                    <h4>Instagram</h4>
                    <textarea id="modal-ig-caption" rows="5"></textarea>
                </div>
                <div class="generated-section">
                    <h4>TikTok</h4>
                    <textarea id="modal-tt-description" rows="4"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Abbrechen</button>
                <button class="btn-primary" onclick="saveGenerated()">Caption übernehmen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Post bearbeiten -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeEditModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Post bearbeiten</h3>
                <button class="modal-close" onclick="closeEditModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-student-name">Vorname</label>
                    <input type="text" id="edit-student-name" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="edit-exam-date">Prüfungsdatum</label>
                    <input type="date" id="edit-exam-date">
                </div>
                <div class="form-group">
                    <label for="edit-category">Kategorie</label>
                    <select id="edit-category">
                        <option value="B">B – Auto</option>
                        <option value="A">A – Motorrad</option>
                        <option value="A1">A1 – Kleinmotorrad</option>
                        <option value="BE">BE – Auto mit Anhänger</option>
                        <option value="C">C – Lastwagen</option>
                        <option value="D">D – Bus</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-details">Details für KI</label>
                    <textarea id="edit-details" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-caption">Instagram Caption</label>
                    <textarea id="edit-caption" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-story-text">TikTok Beschreibung</label>
                    <textarea id="edit-story-text" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-status">Status</label>
                    <select id="edit-status">
                        <option value="draft">Draft</option>
                        <option value="ready">Ready</option>
                        <option value="published">Published</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEditModal()">Abbrechen</button>
                <button class="btn-primary" onclick="saveEdit()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal: Im Kalender einplanen -->
    <div id="schedule-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeScheduleModal()"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Im Kalender einplanen</h3>
                <button class="modal-close" onclick="closeScheduleModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="schedule-date">Datum *</label>
                    <input type="date" id="schedule-date" required>
                </div>
                <div class="form-group">
                    <label for="schedule-time">Uhrzeit (optional)</label>
                    <input type="time" id="schedule-time">
                </div>
                <div class="form-group">
                    <label for="schedule-platform">Plattform</label>
                    <select id="schedule-platform">
                        <option value="both">Instagram + TikTok</option>
                        <option value="instagram">Nur Instagram</option>
                        <option value="tiktok">Nur TikTok</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeScheduleModal()">Abbrechen</button>
                <button class="btn-primary" onclick="saveSchedule()">Einplanen</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
