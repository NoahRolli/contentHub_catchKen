<!-- index.html – Posts-Seite des catchKen Content Hub -->
<!-- Formular zum Erstellen und Liste aller Posts -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catchKen Content Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- === Header === -->
    <header>
        <div class="header-top">
            <img src="/static/img/logo.png" alt="catchKen" class="header-logo">
            <div class="header-text">
                <h1>catchKen Content Hub</h1>
                <p>Social Media Planner</p>
            </div>
        </div>
        <nav class="header-nav">
            <a href="/" class="btn-nav-link active">Posts</a>
            <a href="/calendar" class="btn-nav-link">Kalender</a>
        </nav>
    </header>

    <main>
        <!-- === Trainingsdaten-Status === -->
        <section class="card training-status" id="training-status">
            <!-- Wird per JavaScript gefüllt -->
        </section>

        <!-- === Formular: Neuer Post === -->
        <section class="card">
            <h2>Post: Prüfung bestanden</h2>
            <form id="success-form" enctype="multipart/form-data">
                
                <!-- Vorname (optional) -->
                <div class="form-group">
                    <label for="student_name">Vorname (optional)</label>
                    <input type="text" id="student_name" name="student_name" 
                           placeholder="z.B. Max" maxlength="100">
                </div>

                <!-- Prüfungsdatum (Pflicht) -->
                <div class="form-group">
                    <label for="exam_date">Prüfungsdatum *</label>
                    <input type="date" id="exam_date" name="exam_date" required>
                </div>

                <!-- Kategorie -->
                <div class="form-group">
                    <label for="category">Kategorie</label>
                    <select id="category" name="category">
                        <option value="B" selected>B – Auto</option>
                        <option value="A">A – Motorrad</option>
                        <option value="A1">A1 – Kleinmotorrad</option>
                        <option value="BE">BE – Auto mit Anhänger</option>
                        <option value="C">C – Lastwagen</option>
                        <option value="D">D – Bus</option>
                    </select>
                </div>

                <!-- Bild-Upload (optional) -->
                <div class="form-group">
                    <label for="image">Bild (optional)</label>
                    <input type="file" id="image" name="image" accept="image/*">
                </div>

                <!-- Consent (Pflicht) -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="consent_given" name="consent_given" required>
                    <label for="consent_given">
                        Einverständnis für Bildnutzung auf Social Media *
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary">Post erstellen</button>
            </form>

            <!-- Feedback-Nachricht -->
            <div id="form-message" class="message hidden"></div>
        </section>

        <!-- === Liste der Posts === -->
        <section class="card">
            <h2>Alle Posts</h2>
            <div id="posts-list">
                <p class="loading">Lade Posts...</p>
            </div>
        </section>
    </main>

    <!-- === Modal: Generierte Captions === -->
    <div id="generate-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Generierter Content</h3>
                <button class="modal-close" onclick="closeModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div id="modal-provider-info" class="provider-info"></div>

                <div class="generated-section">
                    <h4>Instagram</h4>
                    <textarea id="modal-ig-caption" rows="5"></textarea>
                </div>

                <div class="generated-section">
                    <h4>TikTok</h4>
                    <textarea id="modal-tt-description" rows="4"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Abbrechen</button>
                <button class="btn-primary" id="modal-save-btn" onclick="saveGenerated()">
                    Caption übernehmen
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
