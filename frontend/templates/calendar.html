<!-- calendar.html – Kalender-Ansicht des catchKen Content Hub -->
<!-- Geplante Posts in Wochen-/2-Wochen-/Monatsansicht mit Drag & Drop -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catchKen – Kalender</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/calendar.css">
</head>
<body>
    <!-- === Header (identisch mit index.html) === -->
    <header>
        <div class="header-top">
            <img src="/static/img/logo.png" alt="catchKen" class="header-logo">
            <div class="header-text">
                <h1>catchKen Content Hub</h1>
                <p>Social Media Planner</p>
            </div>
        </div>
        <nav class="header-nav">
            <a href="/" class="btn-nav-link">Posts</a>
            <a href="/theory" class="btn-nav-link">Theorie</a>
            <a href="/calendar" class="btn-nav-link active">Kalender</a>
            <a href="/training" class="btn-nav-link">Training</a>
        </nav>
    </header>

    <main class="calendar-main">
        <!-- === Toolbar: Navigation + View-Switcher === -->
        <div class="calendar-toolbar">
            <div class="calendar-nav">
                <button class="btn-nav" id="btn-prev" title="Zurück">&larr;</button>
                <h2 id="calendar-title">März 2026</h2>
                <button class="btn-nav" id="btn-next" title="Vor">&rarr;</button>
                <button class="btn-nav btn-today" id="btn-today">Heute</button>
            </div>
            <div class="view-switcher">
                <button class="btn-view active" data-view="week">Woche</button>
                <button class="btn-view" data-view="twoweek">2 Wochen</button>
                <button class="btn-view" data-view="month">Monat</button>
            </div>
        </div>

        <!-- === Kalender Grid === -->
        <div class="calendar-header" id="calendar-header"></div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </main>

    <!-- === Modal: Neuer Kalender-Eintrag === -->
    <div id="entry-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeEntryModal()"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3 id="entry-modal-title">Neuer Eintrag</h3>
                <button class="modal-close" onclick="closeEntryModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="entry-type">Content-Typ</label>
                    <select id="entry-type">
                        <option value="success">Post: Prüfung bestanden</option>
                        <option value="news">News</option>
                        <option value="theory">Theorie</option>
                        <option value="review">Review</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="entry-date">Datum</label>
                    <input type="date" id="entry-date" required>
                </div>
                <div class="form-group">
                    <label for="entry-time">Uhrzeit (optional)</label>
                    <input type="time" id="entry-time">
                </div>
                <div class="form-group">
                    <label for="entry-platform">Plattform</label>
                    <select id="entry-platform">
                        <option value="both">Instagram + TikTok</option>
                        <option value="instagram">Nur Instagram</option>
                        <option value="tiktok">Nur TikTok</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="entry-notes">Notizen (optional)</label>
                    <textarea id="entry-notes" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEntryModal()">Abbrechen</button>
                <button class="btn-primary" id="btn-save-entry">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Modal: Kalender-Eintrag bearbeiten -->
    <div id="edit-cal-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeEditCalModal()"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Eintrag bearbeiten</h3>
                <button class="modal-close" onclick="closeEditCalModal()">&#x2715;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-cal-type">Content-Typ</label>
                    <select id="edit-cal-type">
                        <option value="success">Post: Prüfung bestanden</option>
                        <option value="news">News</option>
                        <option value="theory">Theorie</option>
                        <option value="review">Review</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-cal-date">Datum</label>
                    <input type="date" id="edit-cal-date" required>
                </div>
                <div class="form-group">
                    <label for="edit-cal-time">Uhrzeit (optional)</label>
                    <input type="time" id="edit-cal-time">
                </div>
                <div class="form-group">
                    <label for="edit-cal-platform">Plattform</label>
                    <select id="edit-cal-platform">
                        <option value="both">Instagram + TikTok</option>
                        <option value="instagram">Nur Instagram</option>
                        <option value="tiktok">Nur TikTok</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-cal-notes">Notizen (optional)</label>
                    <textarea id="edit-cal-notes" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-cal-status">Status</label>
                    <select id="edit-cal-status">
                        <option value="draft">Draft</option>
                        <option value="ready">Ready</option>
                        <option value="published">Published</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-small btn-delete" onclick="deleteCalEntry()">Löschen</button>
                <button class="btn-secondary" onclick="closeEditCalModal()">Abbrechen</button>
                <button class="btn-primary" onclick="saveEditCal()">Speichern</button>
            </div>
        </div>
    </div>

    <script src="/static/js/calendar.js"></script>
</body>
</html>
