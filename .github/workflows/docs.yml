# docs.yml – Automatische Dokumentation generieren
# Läuft bei jedem Push auf main und erstellt/aktualisiert docs/auto-generated.md
# Die generierte Doku wird automatisch committed und gepusht

name: Generate Docs

# Wann soll der Workflow laufen?
on:
  push:
    branches: [main]  # Nur bei Push auf main

jobs:
  generate-docs:
    runs-on: ubuntu-latest  # Läuft auf Ubuntu bei GitHub

    # Schreibrechte für den Workflow (damit er committen kann)
    permissions:
      contents: write

    steps:
      # 1. Code auschecken
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python installieren
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Doku-Skript ausführen
      - name: Generate documentation
        run: python scripts/generate_docs.py

      # 4. Änderungen committen und pushen (nur wenn sich was geändert hat)
      - name: Commit and push docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/auto-generated.md
          git diff --staged --quiet || git commit -m "docs: auto-update documentation"
          git pull --rebase origin main
          git push